name: Fyto
description: 'Fyto is a Bay Area agricultural cleantech and robotics company, founded in 2019
  by Jason Prapas with MIT origins, that builds automated cultivation systems for lemna
  — fast-growing aquatic "superplants" in the duckweed family. Its ReCover process, GrowGrid
  raised growbeds, and autonomous Harvester machine capture excess nutrients from dairy and
  livestock operations and convert them into high-protein animal feed, cutting nitrate pollution
  and greenhouse-gas emissions without arable land, synthetic fertilizer, or manual labor. Backed
  by GV, Fyto is scaling regenerative farming from California''s San Joaquin Valley. No public API,
  developer portal, SDK, or documentation is currently published.'
